<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="STUDYHUB" />
  <meta name="application-name" content="STUDYHUB" />
  <meta name="description" content="STUDYHUB – Smart Student Management: Quản lý thời khóa biểu, môn học & GPA, bài tập, lịch thi, ghi chú, chi tiêu sinh viên và Trợ lý AI." />
  <title>STUDYHUB – Smart Student Management</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
  <script>
    // Apply saved theme immediately to prevent white flash
    (function () {
      try {
        var saved = localStorage.getItem("studyhub_theme") || "system";
        var dark = saved === "dark" || (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Aurora Mesh + Floating Orbs + Masked Dot Grid -->
  <div class="aurora-wrap" aria-hidden="true">
    <div class="aurora-mesh"></div>
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>
    <div class="aurora-orb orb-3"></div>
    <div class="dot-grid"></div>
  </div>

  <!-- Top Route Progress Bar -->
  <div id="route-progress" class="route-progress" aria-hidden="true">
    <div id="route-progress-bar" class="route-progress-bar"></div>
  </div>

  <!-- Main Dynamic Application Root -->
  <div id="app"></div>

  <!-- PWA Install Floating Banner -->
  <div id="pwa-banner-root"></div>

  <!-- Modal / Bottom Sheet Container -->
  <div id="modal-root" class="modal-root" aria-hidden="true"></div>

  <!-- Toast Stack -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Built-in Lightweight Confetti Canvas -->
  <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>

  <script src="./js/storage.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/ai.js"></script>
  <script src="./js/pwa.js"></script>
  <script src="./js/views.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
